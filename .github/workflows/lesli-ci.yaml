name: "Lesli Tests Workflow"

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
  pull_request:

jobs:
  lesli-test-engine-brakeman:
    name: Run lesli-test-engine-brakeman
    uses: LesliTech/LesliActions/.github/workflows/lesli-test-engine-brakeman.yaml@master
    with:
      branch: ${{ github.ref_name }}

  lesli-test-engine-minitest:
    name: Run lesli-test-engine-minitest
    needs: lesli-test-engine-brakeman
    uses: LesliTech/LesliActions/.github/workflows/lesli-test-engine-minitest.yaml@master
    with:
      branch: ${{ github.ref_name }}

  lesli-test-builder:
    name: Run lesli-test-builder
    needs: lesli-test-engine-minitest
    uses: LesliTech/LesliActions/.github/workflows/lesli-test-builder.yaml@master
    with:
      branch: ${{ github.ref_name }}

